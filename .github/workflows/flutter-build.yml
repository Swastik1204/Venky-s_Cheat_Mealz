name: Android

on:
  push:
    branches:
      - main
      - prod
    paths:
      - 'admin_control/**'
      - '.github/workflows/flutter-build.yml'
  pull_request:
    branches:
      - main
      - prod
    paths:
      - 'admin_control/**'
      - '.github/workflows/flutter-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'

      - name: Restore google-services.json from Secret
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::GOOGLE_SERVICES_JSON_BASE64 secret is not configured in GitHub Secrets!"
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > admin_control/android/app/google-services.json
          test -s admin_control/android/app/google-services.json || {
            echo "::error::Failed to decode google-services.json or file is empty"
            exit 1
          }
          echo "✅ google-services.json restored successfully."

      - name: Install dependencies
        working-directory: admin_control
        run: flutter pub get

      - name: Analyze code
        working-directory: admin_control
        run: flutter analyze

      - name: Build Release APK
        working-directory: admin_control
        run: flutter build apk --release

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-control-release-apk
          path: admin_control/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
