name: Deploy & Validate

# ═══════════════════════════════════════════════════════════════════════════
# UNIFIED CI/CD TEMPLATE — identical across Blobby / Venky's / cafe_mvp / FSW.
#
# Everything below the PROJECT CONFIG block is byte-for-byte identical in all
# four repositories. To change pipeline behaviour, change it in all four. To
# onboard a new project, copy this file and edit only PROJECT CONFIG.
#
#   check layer : validate (one job per app) + rules-check
#                 → every push and every PR, both branches.
#   gate layer  : prod-checklist-inject + prod-checklist
#                 → PRs targeting `prod` only.
#   ship layer  : deploy-staging     → push to `main`
#                   staging hosting sites (if any) + Firestore rules & indexes
#                 deploy-production  → push to `prod`
#                   production hosting sites (if any) + Firestore rules & indexes
#
# `edited` is in the PR trigger list deliberately: the prod checklist gate
# parses `- [ ]` boxes in the PR body, and a pull_request check only
# re-evaluates on a body edit if the workflow listens for `edited`. Drop it and
# ticking the boxes never turns the check green.
#
# The `prod` ruleset's required status checks must match these job names
# exactly: Validate (customer), Validate (admin), Firestore Rules Synced, Prod PR Checklist
#
# NOTE: Firestore rules and indexes are project-global — one database per
# Firebase project, shared by staging and production hosting sites. Deploying
# them from `main` (deploy-staging) therefore makes `main` the live source of
# truth for security rules, ahead of the prod checklist gate. That is the
# deliberate, requested behaviour; to revert it, drop the "Deploy Firestore
# rules and indexes" step from deploy-staging only.
#
# `--force` on the firestore deploy makes the committed indexes file
# authoritative: an index that exists in the project but not in the file is
# deleted. Keep the indexes file in sync with reality.
# ═══════════════════════════════════════════════════════════════════════════

on:
  push:
    branches:
      - main
      - prod
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
    branches:
      - main
      - prod
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# ─── PROJECT CONFIG — the only per-project values in this file ───
env:
  FIREBASE_PROJECT_ID: 'venky-s-chicken-xperience'
  FIREBASE_CONFIG_DIR: '.'
  PROD_HOSTING_TARGETS: 'hosting:venkys-customer,hosting:venkys-admin'
  STAGING_HOSTING_TARGETS: ''
  RULES_FILES: 'venkys/firestore.rules venkys_admin/firestore.rules'
  PRE_INSTALL_DIR: ''
  INSTALL_FLAGS: ''
  STAGING_API_CUSTOMER: ''
  STAGING_API_ADMIN: ''
  NODE_VERSION: '22'

jobs:
  validate:
    name: Validate (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: customer
            dir: venkys
          - app: admin
            dir: venkys_admin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            venkys/package-lock.json
            venkys_admin/package-lock.json

      - name: Install dependencies
        run: |
          if [ -n "$PRE_INSTALL_DIR" ] && [ "$PRE_INSTALL_DIR" != "${{ matrix.dir }}" ]; then
            ( cd "$PRE_INSTALL_DIR" && npm ci $INSTALL_FLAGS )
          fi
          cd "${{ matrix.dir }}" && npm ci $INSTALL_FLAGS

      # Blocking on purpose. A lint step with continue-on-error is how the
      # WS-09 regression shipped green.
      - name: Lint
        working-directory: ${{ matrix.dir }}
        run: npm run lint

      - name: Build
        working-directory: ${{ matrix.dir }}
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
        run: npm run build

  rules-check:
    name: Firestore Rules Synced
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # With one rules file this asserts it exists; with several it asserts
      # every copy is byte-identical to the first.
      - name: Verify every firestore.rules copy is identical
        run: |
          set -- $RULES_FILES
          base="$1"
          if [ ! -f "$base" ]; then
            echo "::error::Rules file $base is missing."
            exit 1
          fi
          shift
          for f in "$@"; do
            if ! cmp -s "$base" "$f"; then
              echo "::error::$base and $f are not identical!"
              diff -u "$base" "$f" || true
              exit 1
            fi
          done
          echo "firestore.rules verified ($RULES_FILES)"

  prod-checklist-inject:
    name: Auto-Inject Prod Checklist
    if: github.event_name == 'pull_request' && github.base_ref == 'prod'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject prod checklist if missing
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;

            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number });
            const body = pr.body || '';
            const startMarker = '<!-- prod-checklist:start -->';

            if (body.includes(startMarker)) {
              core.info('PR description already contains the prod checklist marker.');
              return;
            }

            const templatePath = path.join(process.env.GITHUB_WORKSPACE, '.github', 'PULL_REQUEST_TEMPLATE', 'prod.md');
            const templateContent = fs.readFileSync(templatePath, 'utf8');
            const newBody = body.trim().length > 0
              ? `${body.trim()}\n\n---\n\n${templateContent}`
              : templateContent;

            await github.rest.pulls.update({ owner, repo, pull_number, body: newBody });
            core.info('Updated PR body with prod checklist.');

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pull_number,
              body: '⚠️ **Prod PR Checklist Auto-Added**\n\nThis PR targets \`prod\`. The required release checklist from \`.github/PULL_REQUEST_TEMPLATE/prod.md\` has been appended to the PR description.\n\nVerify each item for real and tick every box — a separate check on this PR stays red until they are all ticked.',
            });
            core.info('Posted notification comment on PR.');

  prod-checklist:
    name: Prod PR Checklist
    needs: prod-checklist-inject
    if: github.event_name == 'pull_request' && github.base_ref == 'prod'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Require every checklist box ticked
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;

            // Re-fetch rather than trust the event payload — the inject job
            // above may have just rewritten the body.
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number });
            const body = pr.body || '';
            const startMarker = '<!-- prod-checklist:start -->';
            const endMarker = '<!-- prod-checklist:end -->';
            const startIdx = body.indexOf(startMarker);
            const endIdx = body.indexOf(endMarker);

            if (startIdx === -1 || endIdx === -1 || endIdx < startIdx) {
              core.setFailed(
                'This PR targets prod but is missing the release checklist section ' +
                '(expected between ' + startMarker + ' and ' + endMarker + '). ' +
                'See .github/PULL_REQUEST_TEMPLATE/prod.md.'
              );
              return;
            }

            const section = body.slice(startIdx, endIdx);
            const unchecked = section.match(/^[ \t]*-[ \t]+\[[ \t]?\][ \t]+.+$/gm) || [];
            if (unchecked.length > 0) {
              core.setFailed(
                unchecked.length + ' unchecked item(s) in the prod release checklist:\n\n' +
                unchecked.join('\n') +
                '\n\nEvery box must be manually confirmed before this PR can merge to prod.'
              );
              return;
            }

            const checked = section.match(/^[ \t]*-[ \t]+\[[xX]\][ \t]+.+$/gm) || [];
            if (checked.length === 0) {
              core.setFailed('The prod release checklist section is present but empty — nothing was confirmed.');
              return;
            }

            core.info(checked.length + ' checklist item(s) confirmed.');

  deploy-staging:
    name: Deploy to Staging
    needs: [validate, rules-check]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/firebase-sa.json
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            venkys/package-lock.json
            venkys_admin/package-lock.json

      - name: Write service-account credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT secret is not set — it must hold the full service-account JSON key."
            exit 1
          fi
          node -e '
            const fs = require("fs");
            let v = (process.env.FIREBASE_SERVICE_ACCOUNT || "").trim();
            if ((v.startsWith("\"") && v.endsWith("\"")) || (v.startsWith("\x27") && v.endsWith("\x27"))) v = v.slice(1, -1);
            try { const p = JSON.parse(v); v = typeof p === "string" ? p : JSON.stringify(p); } catch (e) {}
            fs.writeFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS, v, "utf8");
          '

      - name: Build apps (staging API base URLs)
        if: env.STAGING_HOSTING_TARGETS != ''
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
        run: |
          ( cd venkys \
            && export VITE_API_BASE_URL="${STAGING_API_CUSTOMER:-$VITE_API_BASE_URL}" \
            && npm ci $INSTALL_FLAGS && npm run build )
          ( cd venkys_admin \
            && export VITE_API_BASE_URL="${STAGING_API_ADMIN:-$VITE_API_BASE_URL}" \
            && npm ci $INSTALL_FLAGS && npm run build )

      - name: Deploy staging hosting sites
        if: env.STAGING_HOSTING_TARGETS != ''
        working-directory: ${{ env.FIREBASE_CONFIG_DIR }}
        run: |
          npx -y firebase-tools@13 deploy \
            --only "$STAGING_HOSTING_TARGETS" \
            --project "$FIREBASE_PROJECT_ID" \
            --force --non-interactive

      - name: Deploy Firestore rules and indexes
        working-directory: ${{ env.FIREBASE_CONFIG_DIR }}
        run: |
          npx -y firebase-tools@13 deploy \
            --only firestore:rules,firestore:indexes \
            --project "$FIREBASE_PROJECT_ID" \
            --force --non-interactive

      - name: Remove credentials
        if: always()
        run: rm -f "$GOOGLE_APPLICATION_CREDENTIALS"

  deploy-production:
    name: Deploy to Production
    needs: [validate, rules-check]
    if: github.ref == 'refs/heads/prod' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/firebase-sa.json
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            venkys/package-lock.json
            venkys_admin/package-lock.json

      - name: Write service-account credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT secret is not set — it must hold the full service-account JSON key."
            exit 1
          fi
          node -e '
            const fs = require("fs");
            let v = (process.env.FIREBASE_SERVICE_ACCOUNT || "").trim();
            if ((v.startsWith("\"") && v.endsWith("\"")) || (v.startsWith("\x27") && v.endsWith("\x27"))) v = v.slice(1, -1);
            try { const p = JSON.parse(v); v = typeof p === "string" ? p : JSON.stringify(p); } catch (e) {}
            fs.writeFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS, v, "utf8");
          '

      - name: Build apps
        if: env.PROD_HOSTING_TARGETS != ''
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
        run: |
          ( cd venkys && npm ci $INSTALL_FLAGS && npm run build )
          ( cd venkys_admin && npm ci $INSTALL_FLAGS && npm run build )

      # One atomic deploy: hosting and Firestore ship together or not at all.
      - name: Deploy hosting + Firestore rules and indexes
        working-directory: ${{ env.FIREBASE_CONFIG_DIR }}
        run: |
          TARGETS="firestore:rules,firestore:indexes"
          if [ -n "$PROD_HOSTING_TARGETS" ]; then
            TARGETS="$PROD_HOSTING_TARGETS,$TARGETS"
          fi
          npx -y firebase-tools@13 deploy \
            --only "$TARGETS" \
            --project "$FIREBASE_PROJECT_ID" \
            --force --non-interactive

      - name: Remove credentials
        if: always()
        run: rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
